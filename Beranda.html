<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Donasi</title>
  <link rel="stylesheet" href="style (1).css">
  <script src="main.js"></script>
</head>
<body>

  <div class="container">
    <!-- Header Navigation -->
    <header class="navbar">
      <span class="nav-brand">Beranda</span>
    </header>

    <!-- Banner Section -->
    <div class="banner">
      <a href="profil.html" class="profile-circle">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT73x_fKFL98quE8z9lROYPWNXbCMImb7XWOwyhjoiRJw&s" alt="Foto Profil">
</a>
      <h1 class="banner-title">#BersamaKitaBisa</h1>
    </div>

    <!-- Main Section -->
    <main class="main-content">
      <h2 class="section-title">Pilihan Donasi:</h2>

      <div class="cards-grid">
        <!-- Card 1 -->
        <div class="card">
          <div class="card-img-wrapper">
            <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?q=80&w=600&auto=format&fit=crop" alt="Bantu Anak Yatim">
          </div>
          <div class="card-body">
            <h3 class="card-title"><a href="detail beranda.html">Bantu</a> Anak Yatim</h3>
            <p class="card-subtitle">Terkumpul: Rp25.000.000</p>
            <div class="progress-track">
              <div class="progress-fill" style="width: 45%;">
                <div class="progress-handle"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="card">
          <div class="card-img-wrapper">
            <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=600&auto=format&fit=crop" alt="Bantu Karhutla Kalimantan">
          </div>
          <div class="card-body">
            <h3 class="card-title">Bantu Karhutla Kalimantan</h3>
            <p class="card-subtitle">Terkumpul: Rp10.000.000</p>
            <div class="progress-track">
              <div class="progress-fill" style="width: 30%;">
                <div class="progress-handle"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="card">
          <div class="card-img-wrapper">
            <img src="https://images.unsplash.com/photo-1584467735871-8e85353a8413?q=80&w=600&auto=format&fit=crop" alt="Bantu Bangun Jembatan">
          </div>
          <div class="card-body">
            <h3 class="card-title">Bantu Bangun Jembatan</h3>
            <p class="card-subtitle">Terkumpul: Rp5.000.000</p>
            <div class="progress-track">
              <div class="progress-fill" style="width: 25%;">
                <div class="progress-handle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
