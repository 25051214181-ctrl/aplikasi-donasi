<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BersamaBisa</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js"></script>
</head>
<body>

  <div class="auth-container">
    <!-- Judul Kaligrafi -->
    <h1 class="script-title">
      Selamat datang di<br>
      BersamaBisa
    </h1>

    <!-- Card Form Login -->
    <div class="auth-card">
      <form action="Beranda.html">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Value" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Value" required>
        </div>

        <button type="submit" class="auth-btn">Login</button>

        <div class="auth-links">
          <a href="registerrev.html">Belum ada Akun? Tenanggg... Klik di Sini</a>
          <a href="lupapwrev.html">Lupa password? Klik di Sini</a>
        </div>
      </form>
    </div>

    <!-- Tagline Bawah -->
    <p class="script-footer">#BersamaKitaBisa</p>
  </div>

</body>
</html>
