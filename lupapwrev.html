<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Password - BersamaBisa</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js"></script>
</head>
<body>

  <div class="auth-container">
    <!-- Judul Kaligrafi -->
    <h1 class="script-title">Atur Ulang Password</h1>

    <!-- Card Form Lupa Password -->
    <div class="auth-card">
      <form action="loginrev.html">
        <div class="form-group">
          <label for="email">Masukkan Email Terdaftar</label>
          <input type="email" id="email" placeholder="Value" required>
        </div>

        <button type="submit" class="auth-btn">Kirim Link Reset</button>

        <div class="auth-links">
          <a href="loginrev.html">Kembali ke halaman Login</a>
        </div>
      </form>
    </div>

    <!-- Tagline Bawah -->
    <p class="script-footer">#BersamaKitaBisa</p>
  </div>

</body>
</html>
