<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Pengguna</title>
  <link rel="stylesheet" href="profil.css">
  <script src="profile.js"></script>
</head>
<body>

  <div class="page-container">
    <h1 class="page-title">Profil Pengguna</h1>

    <!-- Card Profil -->
    <div class="profile-card">
      
      <!-- Hero Banner Oranye -->
      <div class="hero-banner">
       <div class="avatar-circle">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT73x_fKFL98quE8z9lROYPWNXbCMImb7XWOwyhjoiRJw&s" alt="Foto Profil">
</div>
        <div class="user-info">
          <h2 class="user-name">User</h2>
          <p class="user-email">Pengguna@gmail.com</p>
          <a href="edit-profil.html" class="btn-edit-header">Edit</a>
        </div>
      </div>

      <!-- Detail Informasi (2 Kolom) -->
      <div class="profile-body">
        <div class="info-grid">
          
          <!-- Kolom Kiri -->
          <div class="info-column">
            <div class="form-group">
              <label>Full Name</label>
              <div class="read-only-box">User</div>
            </div>

            <div class="form-group">
              <label>Gender</label>
              <div class="read-only-box">Pria</div>
            </div>

            <div class="form-group">
              <label>Language</label>
              <div class="read-only-box">Indonesia</div>
            </div>
          </div>

          <!-- Kolom Kanan -->
          <div class="info-column">
            <div class="form-group">
              <label>Country</label>
              <div class="read-only-box">Indonesia</div>
            </div>

            <div class="form-group">
              <label class="section-subtitle">My email Address</label>
              <div class="email-badge-card">
                <div class="email-icon-box">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </div>
                <div class="email-details">
                  <span class="email-text">Pengguna@gmail.com</span>
                  <span class="email-time">1 month ago</span>
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- Tombol Logout -->
        <div class="action-row">
          <button type="button" class="btn-logout" onclick="openModal('logoutModal1')">Logout</button>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL 1: Konfirmasi Logout -->
  <div id="logoutModal1" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <h3 class="modal-title">Apakah anda<br>yakin ingin keluar?</h3>
      <div class="modal-actions">
        <button class="btn-modal-solid" onclick="closeModal('logoutModal1')">Tidak</button>
        <button class="btn-modal-outline" onclick="switchModal('logoutModal1', 'logoutModal2')">Ya, saya yakin</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Sukses Logout -->
  <div id="logoutModal2" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
        </svg>
      </div>
      <h3 class="modal-title">Selamat anda<br>sukses keluar</h3>
      <div class="modal-actions">
        <a href="login.html" class="btn-modal-solid text-center">Kembali ke Login</a>
      </div>
    </div>
  </div>

  <script>
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function switchModal(closeId, openId) {
      closeModal(closeId);
      openModal(openId);
    }
  </script>
</body>
</html>
