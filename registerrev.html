<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - BersamaBisa</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js"></script>
</head>
<body>

  <div class="auth-container">
    <!-- Judul Kaligrafi -->
    <h1 class="script-title">Haloo, Kawan Baru</h1>

    <!-- Card Form Register -->
    <div class="auth-card">
      <form action="loginrev.html">
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" placeholder="Value" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Value" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Value" required>
        </div>

        <button type="submit" class="auth-btn">Daftar</button>

        <div class="auth-links">
          <a href="loginrev.html">Sudah punya akun? Login di sini</a>
        </div>
      </form>
    </div>

    <!-- Tagline Bawah -->
    <p class="script-footer">#BersamaKitaBisa</p>
  </div>

</body>
</html>
